name: Add resilient user management loader
on:
  push:
    paths:
      - _user_management_revive.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add user management revive script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./user-management-revive.js" defer></script>'
          if 'src="./user-management-revive.js"' not in s:
              marker = '<script src="./role-session-fix.js" defer></script>'
              s = s.replace(marker, marker + tag, 1) if marker in s else s.replace('</head>', tag + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          sw = Path('sw.js')
          ss = sw.read_text(encoding='utf-8')
          if "'./user-management-revive.js'" not in ss:
              ss = ss.replace("'./role-session-fix.js'", "'./role-session-fix.js', './user-management-revive.js'")
          ss = ss.replace("const CACHE_NAME = 'melati-mas-kunjungan-v11';", "const CACHE_NAME = 'melati-mas-kunjungan-v14';")
          sw.write_text(ss, encoding='utf-8')
          Path('_user_management_revive.txt').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js _user_management_revive.txt
          git commit -m "Fix user management panel lifecycle"
          git push
