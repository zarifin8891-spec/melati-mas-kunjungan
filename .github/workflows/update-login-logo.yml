name: Update login logo
on:
  push:
    paths:
      - _logo_update_trigger.txt
permissions:
  contents: write
jobs:
  update-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace login logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="logo">MM</div><div><b>Melati Mas Residence'
          new = '<img src="./icon-192.svg" alt="Melati Mas Residence" style="width:52px;height:52px;border-radius:14px;object-fit:cover"><div><b>Melati Mas Residence'
          if old not in s:
              raise SystemExit('Login logo target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use Melati Mas logo on login"
          git push