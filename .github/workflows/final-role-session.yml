name: Install definitive role session handler
on:
  push:
    paths:
      - final-role-session.js
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load final role session handler and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./final-role-session.js" defer></script>'
          if tag not in s:
              marker = '<script src="./session-clean-logout.js" defer></script>'
              s = s.replace(marker, marker + tag, 1) if marker in s else s.replace('</head>', tag + '</head>', 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          ss = sw.read_text(encoding='utf-8')
          ss = re.sub(r"const CACHE_NAME = 'melati-mas-kunjungan-v\d+';", "const CACHE_NAME = 'melati-mas-kunjungan-v16';", ss, count=1)
          if "'./final-role-session.js'" not in ss:
              ss = ss.replace("'./session-clean-logout.js'", "'./session-clean-logout.js', './final-role-session.js'", 1)
          enh = '<script src="./auth-enhancements.js" defer></script><script src="./role-enhancements.js" defer></script><script src="./login-stability.js" defer></script><script src="./navigation-fix.js" defer></script><script src="./role-session-fix.js" defer></script><script src="./user-management-revive.js" defer></script><script src="./session-clean-logout.js" defer></script><script src="./final-role-session.js" defer></script>'
          ss = re.sub(r"const ENHANCEMENT = '.*?';", "const ENHANCEMENT = '" + enh + "';", ss, count=1)
          sw.write_text(ss, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js final-role-session.js
          git commit -m "Install definitive role session lifecycle handler"
          git push
