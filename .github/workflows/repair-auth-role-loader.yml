name: Repair auth and role loader
on:
  push:
    paths:
      - _repair_auth_role.txt
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair loaders and service worker cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = '<script src="./auth-enhancements.js" defer></script><script src="./role-enhancements.js" defer></script>'
          if 'src="./auth-enhancements.js"' not in s:
              s = s.replace('</head>', tags + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          sw = Path('sw.js')
          s = sw.read_text(encoding='utf-8')
          s = s.replace("const CACHE_NAME = 'melati-mas-kunjungan-v6';", "const CACHE_NAME = 'melati-mas-kunjungan-v7';", 1)
          old = "  event.respondWith(\n    fetch(request).then(response => {"
          new = "  if (request.url.endsWith('/sw.js')) {\n    event.respondWith(fetch(request, {cache: 'no-store'}));\n    return;\n  }\n\n  event.respondWith(\n    fetch(request).then(response => {"
          if old in s and "request.url.endsWith('/sw.js')" not in s:
              s = s.replace(old, new, 1)
          sw.write_text(s, encoding='utf-8')
          marker = Path('_repair_auth_role.txt')
          marker.unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js _repair_auth_role.txt
          git commit -m "Repair login enhancements loader"
          git push
