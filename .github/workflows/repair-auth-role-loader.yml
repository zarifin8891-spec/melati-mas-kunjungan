name: Repair login UI and cache
on:
  push:
    paths:
      - _repair_auth_role.txt
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make login enhancements permanent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_buttons = '<div style="display:flex;gap:8px;margin-top:18px"><button class="btn primary" style="flex:1">Masuk</button><button type="button" class="btn secondary" id="signupBtn">Daftar</button></div>'
          new_buttons = '<div style="display:flex;gap:8px;margin-top:18px"><button class="btn primary" style="flex:1">Masuk</button></div><div style="display:flex;justify-content:center;margin-top:12px"><button type="button" class="auth-link" id="forgotPassword">Lupa password?</button></div>'
          if old_buttons in s:
              s = s.replace(old_buttons, new_buttons, 1)

          css = '''<style id="login-enhancement-css">
          .password-wrap{position:relative}.password-wrap input{width:100%;padding-right:48px}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:#667085;border-radius:8px;display:grid;place-items:center;padding:0;cursor:pointer}.password-toggle:hover{background:#f2f4f7;color:#344054}.auth-link{border:0;background:transparent;color:#176b5d;font-size:12px;font-weight:700;padding:6px 8px;cursor:pointer}.auth-link:hover{text-decoration:underline}.auth-link:disabled{opacity:.6}
          </style>'''
          if 'id="login-enhancement-css"' not in s:
              s = s.replace('</head>', css + '</head>', 1)

          js = r'''<script>
          document.addEventListener('DOMContentLoaded',()=>{
            const input=document.getElementById('authPassword');
            if(input && !document.getElementById('togglePassword')){
              const parent=input.parentElement;
              const wrap=document.createElement('div'); wrap.className='password-wrap';
              parent.replaceChild(wrap,input); wrap.appendChild(input);
              const b=document.createElement('button'); b.type='button'; b.id='togglePassword'; b.className='password-toggle'; b.setAttribute('aria-label','Tampilkan password');
              b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>';
              wrap.appendChild(b);
              b.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';b.setAttribute('aria-label',show?'Sembunyikan password':'Tampilkan password');b.innerHTML=show?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.7 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7- .3-.6-.7-1.3-1.1-1.9"></path><path d="M6.1 6.1C3.4 8 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.3 4-.8"></path></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>'});
            }

            const forgot=document.getElementById('forgotPassword');
            if(forgot){
              forgot.addEventListener('click',async()=>{
                const email=document.getElementById('authEmail')?.value.trim();
                if(!email){ if(typeof msg==='function') msg('Masukkan email terlebih dahulu, lalu pilih Lupa password.',true); document.getElementById('authEmail')?.focus(); return; }
                forgot.disabled=true; forgot.textContent='Mengirim...';
                try{
                  const redirectTo=window.location.origin+window.location.pathname;
                  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
                  if(error){if(typeof msg==='function') msg((error.message||'Terjadi kesalahan saat autentikasi.'),true);forgot.disabled=false;forgot.textContent='Lupa password?';return;}
                  if(typeof msg==='function') msg('Jika email terdaftar, link untuk membuat password baru sudah dikirim. Periksa Inbox dan Spam.',false);
                  forgot.textContent='Coba lagi 60 dtk';
                  setTimeout(()=>{forgot.disabled=false;forgot.textContent='Lupa password?'},60000);
                }catch(e){if(typeof msg==='function') msg(e?.message||'Terjadi kesalahan saat autentikasi.',true);forgot.disabled=false;forgot.textContent='Lupa password?';}
              });
            }
          });
          </script>'''
          if 'id="togglePassword"' not in s:
              s = s.replace('</body>', js + '</body>', 1)

          p.write_text(s, encoding='utf-8')

          sw=Path('sw.js')
          sws=sw.read_text(encoding='utf-8')
          sws=sws.replace("const CACHE_NAME = 'melati-mas-kunjungan-v6';", "const CACHE_NAME = 'melati-mas-kunjungan-v8';")
          sws=sws.replace("const CACHE_NAME = 'melati-mas-kunjungan-v7';", "const CACHE_NAME = 'melati-mas-kunjungan-v8';")
          if "request.url.endsWith('/sw.js')" not in sws:
              marker="  event.respondWith(\n    fetch(request).then(response => {"
              replacement="  if (request.url.endsWith('/sw.js')) {\n    event.respondWith(fetch(request, {cache: 'no-store'}));\n    return;\n  }\n\n  event.respondWith(\n    fetch(request).then(response => {"
              sws=sws.replace(marker,replacement,1)
          sw.write_text(sws,encoding='utf-8')

          Path('_repair_auth_role.txt').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js _repair_auth_role.txt
          git commit -m "Make login enhancements permanent and refresh PWA cache"
          git push
