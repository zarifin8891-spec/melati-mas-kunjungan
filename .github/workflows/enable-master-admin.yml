name: Enable Master Data admin UI
on:
  push:
    paths:
      - _enable_master_admin.txt
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Master Data admin module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./master-data-admin.js" defer></script>'
          if 'src="./master-data-admin.js"' not in s:
              marker = '<script src="./session-clean-logout.js" defer></script>'
              if marker in s:
                  s = s.replace(marker, marker + tag, 1)
              else:
                  s = s.replace('</head>', tag + '</head>', 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          ss = sw.read_text(encoding='utf-8')
          ss = re.sub(r"const CACHE_NAME = 'melati-mas-kunjungan-v\\d+';", "const CACHE_NAME = 'melati-mas-kunjungan-v16';", ss, count=1)
          if "'./master-data-admin.js'" not in ss:
              ss = ss.replace("'./session-clean-logout.js'", "'./session-clean-logout.js', './master-data-admin.js'", 1)
          enhancement = '<script src="./auth-enhancements.js" defer></script><script src="./role-enhancements.js" defer></script><script src="./login-stability.js" defer></script><script src="./navigation-fix.js" defer></script><script src="./role-session-fix.js" defer></script><script src="./user-management-revive.js" defer></script><script src="./session-clean-logout.js" defer></script><script src="./master-data-admin.js" defer></script>'
          ss = re.sub(r"const ENHANCEMENT = '.*?';", "const ENHANCEMENT = '" + enhancement + "';", ss, count=1)
          sw.write_text(ss, encoding='utf-8')
          Path('_enable_master_admin.txt').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js _enable_master_admin.txt
          git commit -m "Enable admin Master Data management UI"
          git push
