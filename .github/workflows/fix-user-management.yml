name: Fix user management reappearance
on:
  push:
    paths:
      - _fix_user_management.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch user management bridge and cache
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('role-enhancements.js')
          s = p.read_text(encoding='utf-8')
          marker = 'window.__editManagedUser = editManagedUser;'
          replacement = 'window.__ensureUserManagement = addUserManagement;\n  ' + marker
          if 'window.__ensureUserManagement = addUserManagement;' not in s:
              if marker not in s:
                  raise SystemExit('Expected role-enhancements marker not found')
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          sws = sw.read_text(encoding='utf-8')
          import re
          sws = re.sub(r"const CACHE_NAME = 'melati-mas-kunjungan-v\d+';", "const CACHE_NAME = 'melati-mas-kunjungan-v13';", sws, count=1)
          sw.write_text(sws, encoding='utf-8')

          Path('_fix_user_management.txt').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add role-enhancements.js sw.js _fix_user_management.txt
          git commit -m "Fix user management panel after role switch"
          git push
