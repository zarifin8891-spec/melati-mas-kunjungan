name: Fix role lifecycle
on:
  push:
    paths:
      - _fix_role_lifecycle.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load role lifecycle script and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./role-lifecycle-fix.js" defer></script>'
          if 'src="./role-lifecycle-fix.js"' not in s:
              marker = '<script src="./role-session-fix.js" defer></script>'
              if marker in s:
                  s = s.replace(marker, marker + tag, 1)
              else:
                  s = s.replace('</head>', tag + '</head>', 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          sws = sw.read_text(encoding='utf-8')
          import re
          sws = re.sub(r"const CACHE_NAME = 'melati-mas-kunjungan-v\d+';", "const CACHE_NAME = 'melati-mas-kunjungan-v14';", sws, count=1)
          if "'./role-lifecycle-fix.js'" not in sws:
              sws = sws.replace("'./role-session-fix.js'", "'./role-session-fix.js', './role-lifecycle-fix.js'", 1)
          if "role-lifecycle-fix.js" not in sws:
              sws = sws.replace("const ENHANCEMENT = '<script src=\"./auth-enhancements.js\" defer></script><script src=\"./role-enhancements.js\" defer></script><script src=\"./login-stability.js\" defer></script><script src=\"./navigation-fix.js\" defer></script>'", "const ENHANCEMENT = '<script src=\"./auth-enhancements.js\" defer></script><script src=\"./role-enhancements.js\" defer></script><script src=\"./login-stability.js\" defer></script><script src=\"./navigation-fix.js\" defer></script><script src=\"./role-lifecycle-fix.js\" defer></script>'", 1)
          sw.write_text(sws, encoding='utf-8')

          Path('_fix_role_lifecycle.txt').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js _fix_role_lifecycle.txt
          git commit -m "Fix repeated login role UI lifecycle"
          git push
