name: Add role session fix
on:
  push:
    paths:
      - _add_role_session_fix.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch role session handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./role-session-fix.js" defer></script>'
          if tag not in s:
              marker = '<script src="./navigation-fix.js" defer></script>'
              if marker in s:
                  s = s.replace(marker, marker + tag, 1)
              else:
                  s = s.replace('</head>', tag + '</head>', 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          sws = sw.read_text(encoding='utf-8')
          import re
          sws = re.sub(r"const CACHE_NAME = '[^']+';", "const CACHE_NAME = 'melati-mas-kunjungan-v11';", sws, count=1)
          if "'./role-session-fix.js'" not in sws:
              sws = sws.replace("'./navigation-fix.js'", "'./navigation-fix.js', './role-session-fix.js'", 1)
          sw.write_text(sws, encoding='utf-8')

          Path('_add_role_session_fix.txt').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js _add_role_session_fix.txt
          git commit -m "Fix role indicator when switching users"
          git push
