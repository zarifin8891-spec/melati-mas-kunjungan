name: Fix navigation
on:
  push:
    paths:
      - _fix_navigation.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add robust navigation loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./navigation-fix.js" defer></script>'
          if 'src="./navigation-fix.js"' not in s:
              marker = '<script src="./login-stability.js" defer></script>'
              if marker in s:
                  s = s.replace(marker, marker + tag, 1)
              else:
                  s = s.replace('</head>', tag + '</head>', 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          sws = sw.read_text(encoding='utf-8')
          sws = sws.replace("const CACHE_NAME = 'melati-mas-kunjungan-v9';", "const CACHE_NAME = 'melati-mas-kunjungan-v10';", 1)
          if "'./navigation-fix.js'" not in sws:
              sws = sws.replace("'./login-stability.js', './login-stability.js'", "'./login-stability.js', './navigation-fix.js'", 1)
              sws = sws.replace("'./login-stability.js'", "'./login-stability.js', './navigation-fix.js'", 1)
              sws = sws.replace("'./login-stability.js', './navigation-fix.js', './navigation-fix.js'", "'./login-stability.js', './navigation-fix.js'", 1)
          sws = sws.replace("<script src='./login-stability.js' defer></script>", "<script src='./login-stability.js' defer></script><script src='./navigation-fix.js' defer></script>")
          if "navigation-fix.js" not in sws.split('ENHANCEMENT =',1)[0]:
              pass
          sw.write_text(sws, encoding='utf-8')

          marker = Path('_fix_navigation.txt')
          marker.unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js _fix_navigation.txt
          git commit -m "Fix mobile menu navigation"
          git push
