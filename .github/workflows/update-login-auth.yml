name: Update login auth UI
on:
  push:
    paths:
      - _login_auth_trigger.txt
permissions:
  contents: write
jobs:
  update-auth-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update login form and service worker
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''\n.password-wrap{position:relative}.password-wrap input{width:100%;padding-right:46px}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:#667085;border-radius:8px;display:grid;place-items:center;padding:0}.password-toggle:hover{background:#f2f4f7;color:#344054}.password-toggle:focus-visible{outline:2px solid #6eafa4;outline-offset:2px}.password-toggle svg{width:20px;height:20px;pointer-events:none}\n'''
          if '.password-toggle{' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          old_field = '<div class="field" style="margin-top:12px"><label>PASSWORD</label><input id="authPassword" type="password" required minlength="6"></div>'
          new_field = '''<div class="field" style="margin-top:12px"><label>PASSWORD</label><div class="password-wrap"><input id="authPassword" type="password" required minlength="6"><button type="button" class="password-toggle" id="togglePassword" aria-label="Tampilkan password" title="Tampilkan password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div></div>'''
          if old_field in s:
              s = s.replace(old_field, new_field, 1)
          elif 'id="togglePassword"' not in s:
              raise SystemExit('Password field target not found')

          marker = "function msg(t,e=false){const x=document.getElementById('authMsg');x.style.display='block';x.textContent=t;x.style.background=e?'#fee4e2':'#eef2f6'}"
          helper = '''function msg(t,e=false){const x=document.getElementById('authMsg');x.style.display='block';x.textContent=t;x.style.background=e?'#fee4e2':'#eef2f6'}
function friendlyAuthError(error){const raw=String(error?.message||'');const low=raw.toLowerCase();if(error?.code==='over_email_send_rate_limit'||low.includes('email rate limit exceeded'))return('Pengiriman email autentikasi sedang mencapai batas. Jangan klik Daftar berulang. Jika akun sudah terdaftar, gunakan Masuk. Coba lagi setelah batas email pulih.');if(error?.code==='over_request_rate_limit'||Number(error?.status)===429)return('Terlalu banyak permintaan ke layanan login. Tunggu beberapa menit lalu coba lagi.');if(low.includes('invalid login credentials'))return('Email atau password salah.');if(low.includes('email not confirmed'))return('Email akun belum dikonfirmasi. Silakan konfirmasi email terlebih dahulu.');return(raw||'Terjadi kesalahan saat autentikasi.')}
function setSignupCooldown(seconds=60){const b=document.getElementById('signupBtn');if(!b)return;let left=seconds;b.disabled=true;const original='Daftar';b.textContent=original+' ('+left+'s)';const timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);b.disabled=false;b.textContent=original}else b.textContent=original+' ('+left+'s)'},1000)}
const togglePassword=document.getElementById('togglePassword');if(togglePassword){const passwordInput=document.getElementById('authPassword');const eye='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>';const eyeOff='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.7 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.8 18.8 0 0 1-3.1 3.8M6.1 6.1C3.4 8 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.3 4-.8"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>';togglePassword.addEventListener('click',()=>{const show=passwordInput.type==='password';passwordInput.type=show?'text':'password';togglePassword.setAttribute('aria-pressed',String(show));togglePassword.setAttribute('aria-label',show?'Sembunyikan password':'Tampilkan password');togglePassword.title=show?'Sembunyikan password':'Tampilkan password';togglePassword.innerHTML=show?eyeOff:eye})}
'''
          if marker in s and 'function friendlyAuthError' not in s:
              s = s.replace(marker, helper, 1)
          elif 'function friendlyAuthError' not in s:
              raise SystemExit('Auth message marker not found')

          s = s.replace("if(error)msg(error.message,true)});", "if(error)msg(friendlyAuthError(error),true)});", 1)

          old_signup = "document.getElementById('signupBtn').addEventListener('click',async()=>{const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;if(!email||password.length<6){msg('Isi email dan password minimal 6 karakter.',true);return}const {data,error}=await sb.auth.signUp({email,password});if(error)msg(error.message,true);else msg('Pendaftaran berhasil. Jika email confirmation aktif, cek email lalu masuk.')});"
          new_signup = "document.getElementById('signupBtn').addEventListener('click',async()=>{const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;if(!email||password.length<6){msg('Isi email dan password minimal 6 karakter.',true);return}setSignupCooldown(60);const {data,error}=await sb.auth.signUp({email,password});if(error)msg(friendlyAuthError(error),true);else msg('Pendaftaran berhasil. Jika email confirmation aktif, cek email lalu masuk.')});"
          if old_signup in s:
              s = s.replace(old_signup, new_signup, 1)
          elif 'setSignupCooldown(60)' not in s:
              raise SystemExit('Signup handler target not found')

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          sws = sw.read_text(encoding='utf-8')
          sws = sws.replace("const CACHE_NAME = 'melati-mas-kunjungan-v2';", "const CACHE_NAME = 'melati-mas-kunjungan-v3';", 1)
          sw.write_text(sws, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Improve login auth handling and password visibility"
          git push